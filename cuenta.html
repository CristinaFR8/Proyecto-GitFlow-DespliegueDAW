<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>

<body>

    <form>
        <fieldset class="caja">
            <legend id="titulo">Crear cuenta</legend>

            <label for="nombre">Nombre de usuario</label>
            <input type="text" id="nombre" placeholder="Astrid_molina88"><br>

            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="astMol8844@gmail.com"><br>

            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña"><br>

            <label for="confirm">Confirma la contraseña</label>
            <input type="password" id="confirm"><br>

            <button type="submit" id="crear_cuenta">Crear</button>
        </fieldset>
    </form>

    <footer>
        © 2026 <b>CanguPet</b> · Cuidado de mascotas a domicilio · v1.0.0
    </footer>

</body>

</html>
